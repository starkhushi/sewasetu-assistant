# Render blueprint: one free web service running the whole portal (see deploy/render/).
# The database is Neon's free Postgres; paste its connection string as DATABASE_URL.
services:
  - type: web
    name: sewasetu
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # free key from https://aistudio.google.com/apikey, for the website's Gemma chat
      - key: GEMINI_API_KEY
        sync: false
      # Google Search Console HTML-tag value, to request a Safe Browsing review
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
