services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    ports:
      # local only: the eval runner reads the database after each conversation
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # the two MCP servers, as the public sees them; tokens for them are accepted by the API
      MCP_CITIZEN_URL: ${MCP_CITIZEN_URL:-http://localhost:8101/mcp/citizen}
      MCP_OFFICER_URL: ${MCP_OFFICER_URL:-http://localhost:8102/mcp/officer}
      EVAL_RESULTS_DIR: /app/eval_results
      # the website's own chat assistant (assistant.py): Gemma via the Gemini API, acting
      # through the citizen MCP server like any other client
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MCP_CITIZEN_INTERNAL_URL: http://mcp-citizen:8101/mcp/citizen
      PORTAL_SELF_URL: http://127.0.0.1:8000
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      - ./evals/results:/app/eval_results:ro

  mcp-citizen:
    build: ./mcp
    command: ["python", "-m", "sewasetu_mcp.citizen"]
    ports:
      - "8101:8101"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_INTERNAL_URL: http://app:8000
      MCP_CITIZEN_URL: ${MCP_CITIZEN_URL:-http://localhost:8101/mcp/citizen}
    depends_on:
      - app

  mcp-officer:
    build: ./mcp
    command: ["python", "-m", "sewasetu_mcp.officer"]
    ports:
      - "8102:8102"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_INTERNAL_URL: http://app:8000
      MCP_OFFICER_URL: ${MCP_OFFICER_URL:-http://localhost:8102/mcp/officer}
    depends_on:
      - app

  scheduler:
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
